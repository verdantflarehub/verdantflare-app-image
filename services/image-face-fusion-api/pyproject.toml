[project]
name = "verdantflare-image-face-fusion-api"
version = "0.2.0"
description = "VerdantFlare image-face-fusion-api service"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.28.0",
  "pydantic>=2.6.0",
  "numpy==2.4.6",
  "Pillow>=10.0.0",
  "opencv-python-headless==5.0.0.93",
  "onnxruntime-gpu==1.29.0",
  "onnx==1.22.0",
  "scipy==1.18.0",
  "tqdm==4.70.0",
  "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools==78.1.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Docker and tests run the explicitly copied source via PYTHONPATH.
py-modules = []

[dependency-groups]
test = [
  "fastapi>=0.110.0",
  "uvicorn>=0.28.0",
  "pydantic>=2.6.0",
  "numpy==2.4.6",
  "Pillow>=10.0.0",
  "opencv-python-headless==5.0.0.93",
  "onnxruntime==1.29.0",
  "onnx==1.22.0",
  "scipy==1.18.0",
  "tqdm==4.70.0",
  "httpx>=0.27.0",
]
