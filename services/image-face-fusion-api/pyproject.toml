[project]
name = "verdantflare-image-face-fusion-api"
version = "0.1.3"
description = "VerdantFlare image-face-fusion-api service"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.28.0",
  "pydantic>=2.6.0",
  "numpy>=1.24.0",
  "Pillow>=10.0.0",
  "opencv-python-headless>=4.9.0.80",
  "onnxruntime-gpu>=1.17.0",
  "insightface>=0.7.3",
  "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools==78.1.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Docker and tests run the explicitly copied source via PYTHONPATH.
py-modules = []

[dependency-groups]
test = [
  "fastapi>=0.110.0",
  "uvicorn>=0.28.0",
  "pydantic>=2.6.0",
  "numpy>=1.24.0",
  "Pillow>=10.0.0",
  "opencv-python-headless>=4.9.0.80",
  "onnxruntime>=1.17.0",
  "httpx>=0.27.0",
]
