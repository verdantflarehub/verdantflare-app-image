[project]
name = "verdantflare-image-moss-api"
version = "0.1.0"
description = "VerdantFlare MOSS-Image self-hosted inference API backed by headless ComfyUI"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.28.0",
  "pydantic>=2.6.0",
  "Pillow>=10.0.0",
  "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools>=68.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []

[dependency-groups]
test = [
  "fastapi>=0.110.0",
  "uvicorn>=0.28.0",
  "pydantic>=2.6.0",
  "Pillow>=10.0.0",
  "httpx>=0.27.0",
  "pytest>=8.0.0",
]
