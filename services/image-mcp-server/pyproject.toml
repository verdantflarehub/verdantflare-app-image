[project]
name = "verdantflare-image-mcp-server"
version = "0.1.23"
description = "VerdantFlare image-mcp-server service"
requires-python = ">=3.11"
dependencies = [
  "mcp==2.1.0",
  "httpx==0.28.1",
  "pydantic==2.12.5",
  "starlette==0.41.3",
  "uvicorn==0.40.0",
  "Pillow==11.0.0",
  "google-genai>=0.1.1",
]

[build-system]
requires = ["setuptools==78.1.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Docker and tests run the explicitly copied source via PYTHONPATH.
py-modules = []
