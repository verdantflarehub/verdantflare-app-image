name: ComfyUI market image

on:
  push:
    branches: [release]
    paths:
      - services/comfyui/**
      - .github/workflows/comfyui.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: comfyui-release
  cancel-in-progress: false

env:
  VERSION: 0.1.0

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - id: image
        env:
          REGISTRY_ENDPOINT: ${{ secrets.REGISTRY_ENDPOINT_ALIYUN }}
        run: |
          set -euo pipefail
          registry_endpoint="${REGISTRY_ENDPOINT%/}"
          test -n "${registry_endpoint}"
          echo "registry_endpoint=${registry_endpoint}" >> "$GITHUB_OUTPUT"
          echo "name=${registry_endpoint}/wod/comfyui" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ${{ steps.image.outputs.registry_endpoint }}
          username: ${{ secrets.REGISTRY_USER_ALIYUN }}
          password: ${{ secrets.REGISTRY_PASSWORD_ALIYUN }}
      - run: '! docker buildx imagetools inspect "${{ steps.image.outputs.name }}:${{ steps.image.outputs.version }}" >/dev/null 2>&1'
      - uses: docker/build-push-action@v6
        with:
          context: services/comfyui
          push: true
          platforms: linux/amd64
          provenance: false
          sbom: false
          tags: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.version }}
          cache-from: type=gha,scope=comfyui
          cache-to: type=gha,mode=max,scope=comfyui
