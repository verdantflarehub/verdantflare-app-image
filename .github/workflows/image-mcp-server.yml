name: Image MCP Server

on:
  push:
    branches: [release]
    paths:
      - services/image-mcp-server/**
      - .github/workflows/image-mcp-server.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: image-mcp-server-release
  cancel-in-progress: false
env:
  SERVICE: image-mcp-server
  VERSION: 0.2.69
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify service version parity
        run: |
          set -euo pipefail
          pip install --no-cache-dir "./services/${SERVICE}"
          PYTHONPATH="services/${SERVICE}" IMAGE_MCP_SERVICE_VERSION="v${VERSION}" python3 -c '
          import os, pathlib, re, tomllib
          from src.server import SERVICE_VERSION, resolve_service_version
          wf_ver = os.environ["VERSION"].strip()
          pyproject = pathlib.Path("services/image-mcp-server/pyproject.toml")
          decl_ver = tomllib.loads(pyproject.read_text(encoding="utf-8"))["project"]["version"].strip()
          dockerfile = pathlib.Path("services/image-mcp-server/Dockerfile").read_text(encoding="utf-8")
          m = re.search(r"org\.opencontainers\.image\.version=\"([^\"]+)\"", dockerfile)
          assert m and m.group(1) == wf_ver, f"Dockerfile label {m.group(1) if m else None} != {wf_ver}"
          assert decl_ver == wf_ver, f"pyproject.toml {decl_ver} != workflow VERSION {wf_ver}"
          assert SERVICE_VERSION == f"v{wf_ver}", f"SERVICE_VERSION {SERVICE_VERSION} != v{wf_ver}"
          assert resolve_service_version({}) == f"v{wf_ver}", f"fallback SERVICE_VERSION != v{wf_ver}"
          '
      - uses: docker/setup-buildx-action@v3
      - id: image
        env:
          REGISTRY_ENDPOINT: ${{ secrets.REGISTRY_ENDPOINT_ALIYUN }}
        run: |
          set -euo pipefail
          registry_endpoint="${REGISTRY_ENDPOINT%/}"
          test -n "${registry_endpoint}"
          echo "registry_endpoint=${registry_endpoint}" >> "$GITHUB_OUTPUT"
          echo "name=${registry_endpoint}/wod/verdantflare-app" >> "$GITHUB_OUTPUT"
          echo "version=${SERVICE}-v${VERSION}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ${{ steps.image.outputs.registry_endpoint }}
          username: ${{ secrets.REGISTRY_USER_ALIYUN }}
          password: ${{ secrets.REGISTRY_PASSWORD_ALIYUN }}
      - run: '! docker buildx imagetools inspect "${{ steps.image.outputs.name }}:${{ steps.image.outputs.version }}" >/dev/null 2>&1'
      - uses: docker/build-push-action@v6
        with:
          context: services/${{ env.SERVICE }}
          build-args: |
            SERVICE_VERSION=v${{ env.VERSION }}
          push: true
          platforms: linux/amd64
          provenance: false
          sbom: false
          tags: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.version }}
          cache-from: type=gha,scope=${{ env.SERVICE }}
          cache-to: type=gha,mode=max,scope=${{ env.SERVICE }}
