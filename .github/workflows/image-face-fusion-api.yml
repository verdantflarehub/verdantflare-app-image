name: Image Face Fusion API

on:
  push:
    branches: [release]
    paths:
      - services/image-face-fusion-api/**
      - .github/workflows/image-face-fusion-api.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-face-fusion-api-release
  cancel-in-progress: false

env:
  SERVICE: image-face-fusion-api
  VERSION: 0.2.0

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch official source
        run: python3 services/${SERVICE}/scripts/fetch_upstream.py "$RUNNER_TEMP/facefusion"
      - name: Run unit tests
        env:
          FACEFUSION_SOURCE_ROOT: ${{ runner.temp }}/facefusion
          REQUIRE_FACEFUSION_TESTS: "1"
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: services/image-face-fusion-api
        run: |
          python3 -m pip install --upgrade pip==25.3
          python3 -m pip install --group services/${SERVICE}/pyproject.toml:test
          python3 -m unittest discover -s services/${SERVICE}/tests -v

  build:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - id: image
        env:
          REGISTRY_ENDPOINT: ${{ secrets.REGISTRY_ENDPOINT_ALIYUN }}
        run: |
          set -euo pipefail
          registry_endpoint="${REGISTRY_ENDPOINT%/}"
          test -n "${registry_endpoint}"
          echo "registry_endpoint=${registry_endpoint}" >> "$GITHUB_OUTPUT"
          echo "name=${registry_endpoint}/wod/verdantflare-app" >> "$GITHUB_OUTPUT"
          echo "version=${SERVICE}-v${VERSION}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ${{ steps.image.outputs.registry_endpoint }}
          username: ${{ secrets.REGISTRY_USER_ALIYUN }}
          password: ${{ secrets.REGISTRY_PASSWORD_ALIYUN }}
      - run: '! docker buildx imagetools inspect "${{ steps.image.outputs.name }}:${{ steps.image.outputs.version }}" >/dev/null 2>&1'
      - uses: docker/build-push-action@v6
        with:
          context: services/${{ env.SERVICE }}
          push: true
          platforms: linux/amd64
          provenance: false
          tags: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.version }}
